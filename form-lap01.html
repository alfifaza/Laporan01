<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Mahasiswa AELPI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('kampus ui.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 400px;
        }
        h2 {
            color: black;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            color: black;
            margin-bottom: 5px;
        }
        input {
            width: calc(100% - 16px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .submit-btn {
            background: black;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #333;
        }
        .info {
            margin-top: 15px;
            font-size: 14px;
            color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Form Data Mahasiswa</h2>
        <form id="mahasiswaForm">
            <div class="form-group">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" name="nama" required>
            </div>
            
            <div class="form-group">
                <label for="nim">NIM:</label>
                <input type="text" id="nim" name="nim" required>
            </div>
            
            <div class="form-group">
                <label for="jurusan">Jurusan:</label>
                <input type="text" id="jurusan" name="jurusan" required>
            </div>
            
            <button type="submit" class="submit-btn">Submit</button>
        </form>
        <p class="info">&copy; 2025 AELPI</p>
        <p class="info">Info lebih lanjut kunjungi <a href="https://ui.ac.id" target="_blank">ui.ac.id</a></p>
    </div>

    <script>
        document.getElementById("mahasiswaForm").addEventListener("submit", function(event) {
            event.preventDefault();
            window.location.href = "https://giphy.com/search/finish";
        });
    </script>
</body>
</html>
