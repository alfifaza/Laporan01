<!DOCTYPE html>

  <title>Tabel AELPI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 30px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    table {
      width: 50%;
      border-collapse: collapse;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    }

    th, td {
      padding: 12px;
      border: 1px solid #000;
      text-align: center;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:hover {
      background-color: #ddd;
    }

  </style>
</head>
